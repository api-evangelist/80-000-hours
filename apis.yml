aid: 80-000-hours
name: 80,000 Hours
description: >-
  80,000 Hours is an independent nonprofit, founded in 2011 by Benjamin Todd and
  William MacAskill out of Oxford, that provides free research and support to help
  people use their careers to help solve the world's most pressing problems. The
  name refers to the roughly 80,000 hours a typical person works over their
  lifetime. It publishes an evidence-based career guide, in-depth problem profiles,
  a long-form podcast, and one-on-one advising, and runs a curated high-impact job
  board at jobs.80000hours.org. Since 2016 it has ranked helping navigate the
  transition to advanced AI as its top priority. It is a content and career-advice
  organization rather than an API producer; no public developer API is published,
  though it does serve a machine-readable llms.txt index of its content.
